[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wansoft-tool"
version = "0.1.0"
description = "Marcelo Wansoft detalle de venta processing and analysis tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pos-core-etl @ git+https://github.com/ToxicFyre/pos-pipeline-core-etl.git",
    "pandas>=1.3.0,<3",
    "python-dotenv>=1.0.0",
    "requests>=2.25.0",
    "streamlit>=1.28.0",
    "pyyaml>=6.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-PyYAML",
    "archbrace @ git+https://github.com/ToxicFyre/archbrace.git",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "data"]

[tool.mypy]
python_version = "3.10"
packages = ["wansoft_tool"]
ignore_missing_imports = true

[tool.archbrace]
select = ["AR"]
fail_on = "error"
extend_exclude = ["tests/**"]
require_module_contract = true
max_function_lines = 40
max_file_lines = 300
max_wrapper_chain_depth = 2
max_fli = 8

[tool.archbrace.severity]
AR070 = "warning"
